name: XAUUSD Telegram Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # ogni 15 minuti (orario UTC)
  workflow_dispatch: {}       # permette anche l'avvio manuale da GitHub

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python main.py

      - name: Salva lo stato aggiornato
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Aggiorna stato bot [skip ci]"
          git push
